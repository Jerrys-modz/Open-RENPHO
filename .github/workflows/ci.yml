name: CI

# Fast checks that need no Bluetooth hardware and no macOS runner: type check, lint, unit tests
# (protocol parsers, body-composition math, demo-mode parsing) and an Expo dependency check.
# The iOS build is covered by screenshots.yml.
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      # Checks that package versions match the Expo SDK and the config plugins resolve.
      - name: Expo doctor
        run: npx expo-doctor

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
